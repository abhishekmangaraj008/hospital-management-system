spring.application.name=hospital-management

# ===============================
# Database - Aiven MySQL
# ===============================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?ssl-mode=REQUIRED&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Server
# ===============================
server.port=8080

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=86400000

# ===============================
# CORS
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

# ===============================
# Admin
# ===============================
app.admin.email=${ADMIN_EMAIL:admin@hospital.com}
app.admin.password=${ADMIN_PASSWORD}